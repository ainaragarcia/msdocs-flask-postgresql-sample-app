<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes Subidas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa; /* Azul pastel */
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #0277bd; /* Azul oscuro */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #0277bd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #0277bd;
            color: white;
            cursor: pointer;
        }
        tr:nth-child(even) {
            background-color: #b3e5fc;
        }
        tr:hover {
            background-color: #81d4fa;
        }
        .filter-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .filter-container input {
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #0277bd;
            border-radius: 4px;
        }
        .filter-container button {
            padding: 8px 15px;
            background-color: #0277bd;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .filter-container button:hover {
            background-color: #01579b;
        }
    </style>
</head>
<body>

    <h1>Imágenes Subidas</h1>

    <!-- Filtro por nombre de archivo -->
    <div class="filter-container">
        <label for="search-input">Buscar por nombre de archivo:</label>
        <input type="text" id="search-input" placeholder="Buscar archivo..." onkeyup="filterImages()">
        <button onclick="filterImages()">Filtrar</button>
    </div>

    {% if imagenes %}
        <!-- Tabla de imágenes -->
        <table id="imagenes-table">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">Usuario</th>
                    <th onclick="sortTable(1)">Archivo</th>
                    <th onclick="sortTable(2)">Fecha</th>
                    <th onclick="sortTable(3)">Rojo</th>
                    <th onclick="sortTable(4)">Verde</th>
                    <th onclick="sortTable(5)">Azul</th>
                </tr>
            </thead>
            <tbody>
                {% for imagen in imagenes %}
                    <tr>
                        <td>{{ imagen.nombreusuario }}</td>
                        <td>{{ imagen.nombre_archivo }}</td>
                        <td>{{ imagen.date }}</td>
                        <td>{{ imagen.rojo }}</td>
                        <td>{{ imagen.verde }}</td>
                        <td>{{ imagen.azul }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No hay imágenes para mostrar.</p>
    {% endif %}

    <script>
        // Función para ordenar la tabla
        function sortTable(n) {
            var table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
            table = document.getElementById("imagenes-table");
            switching = true;
            dir = "asc"; // Por defecto, orden ascendente

            while (switching) {
                switching = false;
                rows = table.rows;

                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[n];
                    y = rows[i + 1].getElementsByTagName("TD")[n];

                    if (dir == "asc") {
                        if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    } else if (dir === "desc") {
                        if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else {
                    if (switchcount === 0 && dir === "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }

        // Función para filtrar las imágenes por nombre de archivo
        function filterImages() {
            var input, filter, table, tr, td, i, txtValue;
            input = document.getElementById("search-input");
            filter = input.value.toUpperCase();
            table = document.getElementById("imagenes-table");
            tr = table.getElementsByTagName("tr");

            for (i = 1; i < tr.length; i++) {
                td = tr[i].getElementsByTagName("td")[1]; // La columna de los nombres de archivo
                if (td) {
                    txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }
    </script>

</body>
</html>
